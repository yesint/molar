[package]
name = "molar_ff"
version = "2.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GAFF/GAFF2 force-field atom typing for MolAR"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/molar_ff"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# The GAFF parity corpus (597 molecules, ~9 MB) is a development fixture only.
exclude = ["tests/data/gaff_ref"]

[dependencies]
molar = { version = "2.2.0", path = "../molar" }
thiserror.workspace = true
matrixmultiply.workspace = true

# Native inference divides independent atom-row blocks between Rayon workers. The
# WASM target uses the same SIMD matrix kernel on one thread because ordinary
# wasm32-unknown-unknown builds do not have shared-memory threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[dev-dependencies]
serde = { workspace = true }
serde_json = "1.0"

[features]
# Forward to molar to build in double precision.
f64 = ["molar/f64"]
# Compatibility name for clients that selected the old optional implementation.
# Espaloma is now always present; this empty feature can be removed in a future
# major release after downstream manifests stop naming it.
espaloma = []
